<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Placeholder illustration of the same house at blue hour with the interior lights on">
  <defs>
    <linearGradient id="t-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060A14"/>
      <stop offset="42%" stop-color="#14264A"/>
      <stop offset="78%" stop-color="#2C5AA8"/>
      <stop offset="100%" stop-color="#4A78C0"/>
    </linearGradient>
    <linearGradient id="t-lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14264A"/>
      <stop offset="100%" stop-color="#080D1A"/>
    </linearGradient>
    <radialGradient id="t-halo">
      <stop offset="0%" stop-color="#F2B872" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#F2B872" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#F2B872" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="t-win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBD9A6"/>
      <stop offset="100%" stop-color="#F2B872"/>
    </linearGradient>
    <filter id="t-blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <clipPath id="t-frame"><rect width="1200" height="750"/></clipPath>
  </defs>

  <g clip-path="url(#t-frame)">
    <rect width="1200" height="750" fill="url(#t-sky)"/>

    <!-- residual sunset warmth low on the horizon -->
    <ellipse cx="880" cy="540" rx="460" ry="120" fill="#F2B872" opacity="0.1"/>

    <!-- distant treeline, silhouetted -->
    <path d="M0 512 q60 -34 118 -8 q54 -40 116 -14 q44 -36 104 -10 q60 -30 128 -4 q70 -34 140 -6 q66 -28 138 -2 q72 -30 148 -6 q62 -22 108 4 V560 H0 Z" fill="#060A14" opacity="0.92"/>

    <rect y="518" width="1200" height="232" fill="url(#t-lawn)"/>

    <!-- driveway -->
    <path d="M812 520 H958 L1096 750 H688 Z" fill="#101B33"/>
    <path d="M812 520 H958 L1096 750 H688 Z" fill="none" stroke="#1D3059" stroke-width="2"/>

    <!-- window glow, painted under the house so it spills onto the lawn -->
    <g filter="url(#t-blur)" opacity="0.85">
      <rect x="330" y="292" width="76" height="88" fill="#F2B872"/>
      <rect x="422" y="292" width="76" height="88" fill="#F2B872"/>
      <rect x="514" y="292" width="76" height="88" fill="#F2B872"/>
      <rect x="606" y="292" width="76" height="88" fill="#F2B872"/>
      <rect x="328" y="402" width="168" height="104" fill="#F2B872"/>
      <rect x="616" y="402" width="76" height="104" fill="#F2B872"/>
      <rect x="754" y="394" width="166" height="132" fill="#F2B872" opacity="0.55"/>
    </g>
    <ellipse cx="510" cy="540" rx="300" ry="52" fill="url(#t-halo)"/>

    <!-- garage wing -->
    <path d="M694 344 L836 272 L978 344 Z" fill="#0A1120"/>
    <rect x="720" y="344" width="232" height="176" fill="#14213B"/>
    <rect x="720" y="344" width="232" height="176" fill="none" stroke="#22376A" stroke-width="1.5"/>
    <rect x="758" y="398" width="156" height="122" fill="#1C2E56"/>
    <g stroke="#26406F" stroke-width="1.5">
      <line x1="758" y1="428" x2="914" y2="428"/>
      <line x1="758" y1="459" x2="914" y2="459"/>
      <line x1="758" y1="490" x2="914" y2="490"/>
    </g>
    <!-- garage lights above the door -->
    <circle cx="770" cy="384" r="5" fill="#F2B872"/>
    <circle cx="902" cy="384" r="5" fill="#F2B872"/>
    <circle cx="770" cy="384" r="26" fill="url(#t-halo)"/>
    <circle cx="902" cy="384" r="26" fill="url(#t-halo)"/>

    <!-- main block -->
    <rect x="640" y="192" width="42" height="84" fill="#0A1120"/>
    <path d="M262 272 L510 172 L758 272 Z" fill="#080E1C"/>
    <path d="M262 272 L510 172 L758 272 Z" fill="none" stroke="#1B2C52" stroke-width="2"/>
    <rect x="300" y="270" width="420" height="250" fill="#16233D"/>
    <rect x="300" y="270" width="420" height="250" fill="none" stroke="#23386B" stroke-width="1.5"/>
    <rect x="640" y="270" width="80" height="250" fill="#060A14" opacity="0.4"/>

    <!-- lit upper windows -->
    <g fill="url(#t-win)" stroke="#F2B872" stroke-width="1.5">
      <rect x="336" y="298" width="62" height="74"/>
      <rect x="428" y="298" width="62" height="74"/>
      <rect x="520" y="298" width="62" height="74"/>
      <rect x="612" y="298" width="62" height="74"/>
    </g>

    <!-- lit lower windows and door -->
    <rect x="336" y="408" width="152" height="92" fill="url(#t-win)" stroke="#F2B872" stroke-width="1.5"/>
    <line x1="412" y1="408" x2="412" y2="500" stroke="#C99A5E" stroke-width="2"/>
    <rect x="622" y="408" width="62" height="92" fill="url(#t-win)" stroke="#F2B872" stroke-width="1.5"/>
    <rect x="518" y="404" width="74" height="116" fill="#2A1F14"/>
    <rect x="518" y="404" width="74" height="116" fill="none" stroke="#8A6A44" stroke-width="2"/>
    <rect x="528" y="416" width="54" height="34" fill="#F2B872" opacity="0.82"/>

    <!-- porch light -->
    <circle cx="606" cy="400" r="5" fill="#F2B872"/>
    <circle cx="606" cy="400" r="34" fill="url(#t-halo)"/>

    <rect x="504" y="512" width="102" height="12" fill="#1A2942"/>

    <!-- tree, silhouetted -->
    <rect x="138" y="428" width="20" height="96" fill="#070C18"/>
    <g fill="#070C18">
      <circle cx="148" cy="392" r="66"/>
      <circle cx="100" cy="416" r="46"/>
      <circle cx="196" cy="418" r="48"/>
      <circle cx="150" cy="444" r="52"/>
    </g>

    <g fill="#0A1425">
      <ellipse cx="330" cy="516" rx="34" ry="20"/>
      <ellipse cx="392" cy="518" rx="28" ry="17"/>
      <ellipse cx="700" cy="518" rx="30" ry="18"/>
    </g>

    <!-- lawn lights along the walk -->
    <g>
      <circle cx="470" cy="560" r="4" fill="#F2B872"/>
      <circle cx="470" cy="560" r="24" fill="url(#t-halo)"/>
      <circle cx="418" cy="608" r="4" fill="#F2B872"/>
      <circle cx="418" cy="608" r="24" fill="url(#t-halo)"/>
      <circle cx="352" cy="668" r="5" fill="#F2B872"/>
      <circle cx="352" cy="668" r="28" fill="url(#t-halo)"/>
      <circle cx="642" cy="562" r="4" fill="#F2B872"/>
      <circle cx="642" cy="562" r="24" fill="url(#t-halo)"/>
      <circle cx="704" cy="612" r="4" fill="#F2B872"/>
      <circle cx="704" cy="612" r="24" fill="url(#t-halo)"/>
    </g>
  </g>
</svg>
